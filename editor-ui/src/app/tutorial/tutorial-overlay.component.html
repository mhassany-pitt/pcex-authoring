<!-- 1. Floating (?) Help Button (Subtle & Unobtrusive) -->
<button *ngIf="!tutorial.isActive" type="button"
  (click)="tutorial.startTourForCurrentPage(true)"
  pTooltip="Page Guide" tooltipPosition="left"
  class="fixed bottom-5 right-5 z-40 bg-white/90 hover:bg-white text-gray-500 hover:text-blue-600 border border-gray-300 hover:border-blue-400 rounded-full w-8 h-8 shadow-sm hover:shadow flex items-center justify-center cursor-pointer opacity-70 hover:opacity-100 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-blue-300">
  <i class="pi pi-question text-xs font-bold"></i>
</button>

<!-- 2. Tour Overlay Container -->
<div *ngIf="tutorial.isActive && tutorial.currentStep" class="tour-overlay-root fixed inset-0 z-[9999] pointer-events-auto">
  <!-- SVG Mask Cutout: The hole is 100% transparent/clear (no blur, no tint) -->
  <svg class="fixed inset-0 w-full h-full pointer-events-none z-[10000]">
    <defs>
      <mask id="spotlight-mask">
        <!-- White base = opaque / dimmed -->
        <rect x="0" y="0" width="100%" height="100%" fill="white" />
        <!-- Black hole = fully transparent / crystal clear -->
        <rect *ngIf="tutorial.spotlightRect && tutorial.hasTargetElement"
          [attr.x]="tutorial.spotlightRect.left"
          [attr.y]="tutorial.spotlightRect.top"
          [attr.width]="tutorial.spotlightRect.width"
          [attr.height]="tutorial.spotlightRect.height"
          rx="8" ry="8" fill="black" />
      </mask>
    </defs>
    <!-- Dim overlay with the cutout applied -->
    <rect x="0" y="0" width="100%" height="100%" fill="rgba(0, 0, 0, 0.65)" mask="url(#spotlight-mask)" />
  </svg>

  <!-- Glowing Focus Ring around the clear cutout -->
  <div *ngIf="tutorial.spotlightRect && tutorial.hasTargetElement"
    class="spotlight-border fixed transition-all duration-300 pointer-events-none rounded-lg z-[10001]"
    [style.top.px]="tutorial.spotlightRect.top"
    [style.left.px]="tutorial.spotlightRect.left"
    [style.width.px]="tutorial.spotlightRect.width"
    [style.height.px]="tutorial.spotlightRect.height">
  </div>

  <!-- Floating Popover Tooltip Card -->
  <div class="tour-popover relative bg-white rounded-xl shadow-2xl border border-gray-100 p-5 w-[380px] max-w-[calc(100vw-32px)] z-[10002] transition-all duration-200"
    [ngClass]="'popover-' + actualPosition"
    [ngStyle]="popoverStyle">

    <!-- Directional Arrow Caret -->
    <div *ngIf="tutorial.hasTargetElement && actualPosition !== 'center'"
      class="popover-arrow"
      [ngClass]="'arrow-' + actualPosition"></div>

    <!-- Card Header -->
    <div class="flex items-center justify-between gap-2 pb-2.5 mb-2.5 border-b border-gray-100">
      <div class="flex items-center gap-2">
        <span class="inline-flex items-center justify-center bg-blue-50 text-blue-700 font-bold text-[11px] px-2.5 py-0.5 rounded-full uppercase tracking-wider">
          {{ tutorial.currentTutorial?.title }}
        </span>
        <span class="text-xs font-semibold text-gray-500">
          {{ tutorial.currentStepIndex + 1 }} / {{ tutorial.totalSteps }}
        </span>
      </div>

      <button type="button" (click)="tutorial.skip()" title="Close tour (Esc)"
        class="text-gray-400 hover:text-gray-600 w-7 h-7 rounded-full flex items-center justify-center hover:bg-gray-100 transition-colors cursor-pointer border-none bg-transparent outline-none">
        <i class="pi pi-times text-xs font-bold"></i>
      </button>
    </div>

    <!-- Card Body -->
    <div class="space-y-1.5 mb-4">
      <h3 class="text-sm font-bold text-gray-900 leading-snug">
        {{ tutorial.currentStep.title }}
      </h3>
      <p class="text-xs text-gray-600 leading-relaxed">
        {{ tutorial.currentStep.content }}
      </p>
    </div>

    <!-- Card Footer -->
    <div class="flex items-center justify-between pt-2.5 border-t border-gray-100">
      <!-- Step Dots Indicator -->
      <div class="flex items-center gap-1.5">
        <span *ngFor="let step of tutorial.currentTutorial?.steps; let idx = index"
          (click)="tutorial.goToStep(idx)"
          [ngClass]="idx === tutorial.currentStepIndex ? 'bg-blue-600 w-4' : 'bg-gray-200 hover:bg-gray-300 w-1.5'"
          class="h-1.5 rounded-full cursor-pointer transition-all duration-200">
        </span>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center gap-2">
        <button *ngIf="tutorial.currentStepIndex > 0" pButton type="button" label="Back"
          class="p-button-text p-button-secondary p-button-sm text-xs py-1 px-2.5 h-7.5"
          (click)="tutorial.prev()">
        </button>

        <button *ngIf="tutorial.currentStepIndex < tutorial.totalSteps - 1" pButton type="button" label="Next"
          icon="pi pi-arrow-right" iconPos="right"
          class="p-button-sm text-xs py-1 px-3.5 h-7.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold shadow-sm"
          (click)="tutorial.next()">
        </button>

        <button *ngIf="tutorial.currentStepIndex === tutorial.totalSteps - 1" pButton type="button" label="Got it!"
          icon="pi pi-check" iconPos="right"
          class="p-button-sm text-xs py-1 px-3.5 h-7.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold shadow-sm"
          (click)="tutorial.done()">
        </button>
      </div>
    </div>
  </div>
</div>
